# Agent Runtime applies this layer after dsh-base and dsh-sdk-app. Its remote
# E2B executor replaces the same-world sandbox capability, so the Harness must
# not start or locally confine processes (packages/sandbox/sandbox/README.md).
# The Runtime API has no interactive approval, question, command, or plan
# channel, and direct Web tools would create unbrokered egress from the Harness
# container.
#
# The base rc.1 FEEDBACK_ONLY row releases session-log records on feedback
# (packages/bundle/base/cordis.patch.yml); local spill locators are unreachable
# through the brokered filesystem. Settings and credentials require DSH_HOME
# documents that Agent Runtime does not provide; the SDK initialization and
# per-run patch select the model and adapter.
# Broker socket paths and secrets are also required per-run overlay values and
# intentionally have no defaults in this bundle.

- id: subprocess
  disabled: true

- id: fs-sandbox
  disabled: true

- id: sandbox
  disabled: true

- id: sandbox-policy
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: tool-pwsh
  disabled: true

- id: approval
  disabled: true

- id: permission
  disabled: true

- id: user-questions
  disabled: true

- id: commands
  disabled: true

- id: command-feedback
  disabled: true

- id: command-goal
  disabled: true

- id: command-compact
  disabled: true

- id: plan-mode
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-fetch-http
  disabled: true

- id: tool-web
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: spill-local
  disabled: true

- id: spill-policy
  disabled: true

- id: settings
  disabled: true

- id: credentials
  disabled: true

- id: agent-default-model
  disabled: true

- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    ripgrepPath: rg

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: ['/workspace/.skills']
    watch: false

- insert:
    - id: subprocess-broker
      name: '@deepseek-ai/dsh-subprocess-broker'
      config:
        cwd: /workspace

    - id: fs-broker
      name: '@deepseek-ai/dsh-fs-broker'
      config:
        cwd: /workspace

    - id: bash
      name: '@deepseek-ai/dsh-bash-local'
      config:
        cwd: /workspace
        timeoutMs: 60000

    - id: runtime-broker-tools
      name: '@deepseek-ai/dsh-runtime-broker'
      config:
        tools: []
